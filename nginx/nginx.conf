map $http_x_forwarded_proto $mundonica_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 100M;

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Preserve the public HTTPS scheme from Cloudflare Tunnel and use the
        # local scheme when the forwarded header is absent.
        proxy_set_header X-Forwarded-Proto $mundonica_forwarded_proto;
    }
}
