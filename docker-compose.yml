services:
  web:
    build: .
    container_name: mundonica_web
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn mundonica.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - static_files:/app/staticfiles
      - media_data:/app/media
    env_file:
      - .env.docker
    environment:
      - DEBUG=false
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,192.168.1.51,mundonica.org,www.mundonica.org
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    container_name: mundonica_nginx
    restart: unless-stopped
    depends_on:
      - web
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /var/www/certbot-webroot:/var/www/certbot-webroot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - static_files:/app/staticfiles:ro
      - media_data:/app/media:ro
    ports:
      - "127.0.0.1:8001:80"
#      - "443:443"

volumes:
  static_files:
  media_data:
