<c-vars eyebrow="" icon="bi-shop" title="" text="" href="" /><div
  class="group relative h-full overflow-hidden rounded-xl2 bg-white p-6 shadow-soft ring-1 ring-slate-900/5 transition-all duration-300 hover:-translate-y-1.5 hover:shadow-lift"
  data-reveal
>
  {% if eyebrow %}
    <span class="nica-eyebrow mb-3">{{ eyebrow }}</span>
  {% endif %}
  <div class="mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-nica-ocean/10 text-nica-ocean">
    <i class="bi {{ icon }} text-2xl" aria-hidden="true"></i>
  </div>
  <h3 class="font-heading text-lg font-bold text-nica-ink">
    {% if href %}
      <a href="{{ href }}" class="after:absolute after:inset-0">{{ title }}</a>
    {% else %}
      {{ title }}
    {% endif %}
  </h3>
  <p class="mt-2 text-sm leading-relaxed text-slate-600">{{ text }}</p>
</div>
